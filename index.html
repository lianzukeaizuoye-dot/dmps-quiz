<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デュエプレ クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface2:#E4E8F2; --ink:#151B33; --sub:#59627F; --line:#CDD3E2;
  --primary:#2A3A9E; --on-primary:#FFFFFF; --primary-soft:#DDE2F7;
  --g-great:#B07D00; --g-good:#1E6FD9; --g-tri:#C25F00; --g-bad:#CF2B2B;
  --target:#B3360B;
  --c-light:#E0B000; --c-light-ink:#3A2E00; --c-water:#1F7AE0; --c-dark:#5A4475; --c-fire:#DD3324; --c-nature:#2E9A46; --c-zero:#8A8FA3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1328; --surface:#191F3D; --surface2:#232A4E; --ink:#ECEFFA; --sub:#9BA4C6; --line:#2E3762;
    --primary:#8EA0FF; --on-primary:#0F1328; --primary-soft:#28305A;
    --g-great:#F2C230; --g-good:#6AA8FF; --g-tri:#FFA94D; --g-bad:#FF6B6B;
    --target:#FFB46B;
    --c-dark:#8B6FB0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1328; --surface:#191F3D; --surface2:#232A4E; --ink:#ECEFFA; --sub:#9BA4C6; --line:#2E3762;
  --primary:#8EA0FF; --on-primary:#0F1328; --primary-soft:#28305A;
  --g-great:#F2C230; --g-good:#6AA8FF; --g-tri:#FFA94D; --g-bad:#FF6B6B;
  --target:#FFB46B;
  --c-dark:#8B6FB0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
  font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.display{font-family:'Dela Gothic One','Hiragino Kaku Gothic StdN','Noto Sans JP',sans-serif;font-weight:400;letter-spacing:.02em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .inner{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top h1{margin:0;font-size:20px;line-height:1.3}
header.top .meta{font-size:13px;color:var(--sub)}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{appearance:none;border:0;background:none;color:var(--sub);font:inherit;font-weight:700;font-size:14px;padding:14px 0 12px;border-top:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--primary);border-top-color:var(--primary)}
h2{font-size:22px;line-height:1.35;margin:0 0 4px}
h3{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:700}
p{margin:0 0 12px}
.lead{color:var(--sub);font-size:14px;margin-bottom:20px}
section.block{margin:0 0 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
button{font:inherit}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--primary);padding:0 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.cardrow:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 0}
.opts{display:grid;gap:8px}
.opt{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--sub);font-size:13px}
.opt .cnt{font-size:13px;color:var(--sub);white-space:nowrap}
.opt.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 4px 0 0 var(--primary)}
.opt.on .cnt{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;color:var(--ink);min-height:42px;font-weight:700;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.note{font-size:13px;color:var(--sub);margin-top:8px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);font-size:14px;margin-bottom:12px}
select,input[type=text],input[type=number],input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%}
label.field{display:block;font-size:13px;color:var(--sub);font-weight:700}
label.field > *{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rangebox{display:flex;align-items:center;gap:8px}
.rangebox span{color:var(--sub)}

/* civ pips */
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;line-height:1}
.pips.lg .pip{width:44px;height:44px;font-size:22px}
.civ-light{background:var(--c-light);color:var(--c-light-ink)}
.civ-water{background:var(--c-water)}
.civ-dark{background:var(--c-dark)}
.civ-fire{background:var(--c-fire)}
.civ-nature{background:var(--c-nature)}
.civ-zero,.civ-other{background:var(--c-zero)}
.chip .pip{width:20px;height:20px;font-size:11px}

/* quiz */
.qbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:14px;color:var(--sub)}
.qbar b{color:var(--ink)}
.progress{height:4px;background:var(--surface2);border-radius:2px;margin:-6px 0 18px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--primary)}
.clue{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:16px}
.ask{font-weight:700;font-size:15px;color:var(--sub);margin-bottom:12px}
.ask .target{color:var(--target);font-weight:900;font-size:1.12em}
.qname .target,.correct-big .target{color:var(--target)}
blockquote.ft{margin:0;font-size:19px;line-height:1.8;font-style:italic;border-left:4px solid var(--primary);padding:2px 0 2px 14px}
.cardtext{font-size:16px;line-height:1.8;white-space:normal}
.spec{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.spec-num{display:flex;flex-direction:column;line-height:1.2}
.spec-num .k{font-size:12px;color:var(--sub);font-weight:700}
.spec-num .v{font-family:'Dela Gothic One',sans-serif;font-size:34px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:17px}
dl.facts dt{color:var(--sub);font-size:14px;font-weight:700;align-self:center}
dl.facts dd{margin:0;font-weight:700}
.qname{font-size:22px;font-weight:700;margin:0 0 6px}
.hint{font-size:14px;background:var(--surface2);border-radius:8px;padding:8px 12px;margin:14px 0 0}
.answerbox{display:flex;gap:8px}
.answerbox input{flex:1;min-height:52px;font-size:18px}
.answerbox .btn{min-height:52px}
.choices{display:grid;gap:8px}
.choices .btn{min-height:52px;justify-content:flex-start;text-align:left;font-size:16px;padding:8px 16px}
.subacts{display:flex;justify-content:space-between;margin-top:10px}

/* result */
.result{text-align:center;padding:8px 0 4px}
.stamp{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;border:6px solid currentColor;font-family:'Dela Gothic One',sans-serif;font-size:84px;line-height:1;transform:rotate(-10deg);margin:6px auto 10px;animation:stamp .32s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{transform:rotate(-10deg) scale(1.6);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.g-great{color:var(--g-great)} .g-good{color:var(--g-good)} .g-tri{color:var(--g-tri)} .g-bad{color:var(--g-bad)}
.verdict{font-family:'Dela Gothic One',sans-serif;font-size:26px;margin:0 0 4px}
.msg{font-size:15px;color:var(--sub)}
dl.answer{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dl.answer dt{color:var(--sub);font-size:13px;font-weight:700;padding-top:3px}
dl.answer dd{margin:0}
dl.answer small{display:block;color:var(--sub);font-size:13px}

/* summary */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 20px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px}
.tally .s{font-family:'Dela Gothic One',sans-serif;font-size:28px;line-height:1.2}
.tally .n{font-weight:700;font-size:18px}
.score{font-family:'Dela Gothic One',sans-serif;font-size:56px;line-height:1.1;margin:4px 0}
.score small{font-family:inherit;font-size:20px;margin-left:4px}

/* card list */
.reshead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px}
.reshead b{font-size:15px}
ul.cardlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
ul.cardlist li + li{border-top:1px solid var(--line)}
.cardrow{appearance:none;width:100%;display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:10px;padding:10px 14px;background:none;border:0;color:var(--ink);text-align:left;cursor:pointer}
.costbadge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface2);font-family:'Dela Gothic One',sans-serif;font-size:15px}
.cardrow .nm{min-width:0}
.cardrow .nm b{display:block;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.cardrow .nm small{color:var(--sub);font-size:12px}
.cardrow .pw{font-size:14px;font-weight:700;color:var(--sub);min-width:48px;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .close{float:right}
.sheet h2{font-size:22px;margin-right:60px}
.sheet .reading{color:var(--sub);font-size:14px;margin-bottom:10px}
.statsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.statsgrid div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.statsgrid .k{display:block;font-size:11.5px;color:var(--sub);font-weight:700}
.statsgrid .v{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.textbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.textbox.ft{font-style:italic;color:var(--sub)}

/* data */
pre.tpl{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:12px;overflow-x:auto;white-space:pre;margin:0 0 10px}
.errlist{margin:10px 0 0;padding:0;list-style:none;font-size:13px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.errlist li{padding:6px 10px;border-top:1px solid var(--line)}
.errlist li:first-child{border-top:0}
.ok{color:var(--g-good);font-weight:700}
.ng{color:var(--g-bad);font-weight:700}
.setrow{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.setrow:first-of-type{border-top:0}
.setrow small{display:block;color:var(--sub);font-size:12px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;border-top:1px solid var(--line)}
.check input{width:22px;height:22px}
details.setpick{margin-top:4px}
details.setpick summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:700;padding:6px 0}
details.setpick summary b{color:var(--ink)}
.setlist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);margin-top:8px}
.setlist .check:first-child{border-top:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* party */
body.player-mode nav.tabs{display:none}
body.player-mode main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.bigcode{font-family:'Dela Gothic One',sans-serif;font-size:clamp(48px,15vw,76px);letter-spacing:.14em;line-height:1.1;margin:0 0 12px}
.qrbox{background:#fff;padding:12px;border-radius:12px;display:inline-block;line-height:0}
.qrbox img,.qrbox canvas{width:180px;height:180px}
.joinurl{font-size:13px;word-break:break-all;color:var(--sub);margin:10px 0}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pchip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.pchip.off{opacity:.45}
.pchip.done{border-color:var(--primary);background:var(--primary-soft)}
.pchip .kick{appearance:none;margin-left:6px;padding:0 8px;min-height:26px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--g-bad);font-weight:700;font-size:12px;cursor:pointer}
.pchip .kick:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
ul.reslist li.me{background:var(--primary-soft)}
.nextcount{text-align:center;font-weight:700;color:var(--sub);margin:0 0 12px}
.nextcount b{font-family:'Dela Gothic One',sans-serif;font-size:22px;color:var(--ink);margin:0 2px}
.countdown{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none}
.countdown[hidden]{display:none}
.countdown span{display:grid;place-items:center;width:min(56vw,240px);height:min(56vw,240px);border-radius:50%;background:var(--surface);border:6px solid var(--primary);color:var(--primary);font-family:'Dela Gothic One',sans-serif;font-size:min(36vw,150px);line-height:1;box-shadow:0 10px 40px rgba(10,14,30,.35)}
.countdown span.pop{animation:cdpop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cdpop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.countdown span.pop{animation:none}}
.timer{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tnum{font-family:'Dela Gothic One',sans-serif;font-size:30px;min-width:2.2ch;text-align:right;line-height:1}
.tbar{flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--primary);transition:width .2s linear}
.clue.big blockquote.ft{font-size:24px}
.clue.big .cardtext{font-size:20px}
.clue.big .qname{font-size:28px}
ol.board,ul.reslist{list-style:none;margin:0 0 16px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
ol.board li,ul.reslist li{display:grid;grid-template-columns:2.4em 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
ol.board li:first-child,ul.reslist li:first-child{border-top:0}
ol.board .rk,ul.reslist .rg{font-family:'Dela Gothic One',sans-serif;font-size:20px;text-align:center}
ol.board .sc,ul.reslist .rp{font-weight:700;white-space:nowrap}
ol.board li.me{background:var(--primary-soft)}
ol.board li.off{opacity:.5}
ul.reslist small{display:block;color:var(--sub);font-size:13px;overflow-wrap:anywhere}
.waiting{text-align:center;padding:32px 16px;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-bottom:16px}
.pts{font-family:'Dela Gothic One',sans-serif;font-size:32px;margin:0}
.correct-big{text-align:center;margin:4px 0 18px}
.correct-big .k{font-size:13px;color:var(--sub);font-weight:700}
.correct-big .v{font-family:'Dela Gothic One',sans-serif;font-size:clamp(24px,7vw,34px);line-height:1.3;margin:2px 0}
.correct-big small{color:var(--sub)}
</style>
</head>
<body>
<header class="top"><div class="inner"><h1 class="display">デュエプレ クイズ</h1><span class="meta" id="meta"></span></div></header>
<main id="main"><p class="lead">カードデータを読み込んでいます…</p></main>
<nav class="tabs" aria-label="画面の切り替え"><div class="inner">
  <button data-tab="quiz" class="on">クイズ</button>
  <button data-tab="party">大会</button>
  <button data-tab="search">検索</button>
  <button data-tab="data">データ</button>
</div></nav>
<div class="countdown" id="countdown" hidden aria-hidden="true"><span></span></div>
<div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="カード詳細" id="sheet-body"></div></div>

<script>
/* ===== サンプルデータ（すべて架空のカード） ===== */
const SAMPLE = [
 {id:'S-001',name:'炎牙の剣士ガルド',reading:'えんがのけんしがるど',type:'クリーチャー',civ:'火',cost:3,power:3000,text:'■スピードアタッカー',rarity:'C',set:'第1弾',flavor:'剣を抜くより先に、炎が走る。'},

const store = {
  db:null,
  open(){ return new Promise(res => { try{ const r = indexedDB.open('dmp-quiz', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); }catch(e){ res(false); } }); },
  get(k){ return new Promise(res => { if(!this.db) return res(null); try{ const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result ?? null); r.onerror = () => res(null); }catch(e){ res(null); } }); },
  set(k, v){ return new Promise(res => { if(!this.db) return res(false); try{ const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }catch(e){ res(false); } }); },
  del(k){ return new Promise(res => { if(!this.db) return res(false); try{ const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }catch(e){ res(false); } }); }
};

/* ===== 表記の正規化と一致度 ===== */
const ARTICLE_RE = /^\s*(ザ|the)\s*[・･=＝\s]\s*/i;
function norm(s){
  if(!s) return '';
  s = String(s).normalize('NFKC').toLowerCase();
  s = s.replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  s = s.replace(/[‐‑‒–—―−\-〜~]/g, 'ー');
  s = s.replace(/[\s・･=＝《》〈〉「」『』【】\[\]()（）!！?？、。,.:：;；'"’‘“”☆★♪]/g, '');
  return s;
}
// max を渡すと、距離が max を超えた時点で max + 1 を返す（帯の外は計算しない）。文字列でも文字配列でも受け取る
function lev(a, b, max = Infinity){
  if(typeof a === 'string') a = chars(a);
  if(typeof b === 'string') b = chars(b);
  const m = a.length, n = b.length;
  if(Math.abs(m - n) > max) return max + 1;
  if(!m) return n; if(!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j > max ? Infinity : j;
  for(let i = 1; i <= m; i++){
    const lo = Math.max(1, i - max), hi = Math.min(n, i + max);
    cur[0] = i > max ? Infinity : i; cur[lo - 1] = lo > 1 ? Infinity : cur[0];
    let rowMin = cur[0];
    for(let j = lo; j <= hi; j++){
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur[j] = v; if(v < rowMin) rowMin = v;
    }
    if(hi < n) cur[hi + 1] = Infinity;
    if(rowMin > max) return max + 1;
    [prev, cur] = [cur, prev];
  }
  return prev[n] > max ? max + 1 : prev[n];
}
// score: 一致度（1 - 編集距離 / 長いほうの文字数）。near: 4文字以上のキーと1文字違い（置換・挿入・削除）
// floor: これ以下の一致度は要らない。一致度が max(floor, それまでの最良) を超えられなくなる距離で lev を打ち切る
// （1文字違いを見るため打ち切りは最低1）。score が floor を超えたときだけ、それが正しい最良値になる
function cardScore(q, c, floor = 0, qc = chars(q)){
  let best = 0, near = false;
  const ql = qc.length;
  for(let i = 0; i < c._keys.length; i++){
    if(c._keys[i] === q) return {exact:true, score:1, near:false};
    const kc = c._keyChars[i], kl = kc.length, L = Math.max(ql, kl);
    const lim = Math.max(1, Math.floor(L * (1 - Math.max(floor, best)) + 1e-9));
    const d = lev(qc, kc, lim);
    if(d > lim) continue;
    const s = L ? 1 - d / L : 0;
    if(s > best) best = s;
    if(d === 1 && kl >= 4) near = true;
  }
  return {exact:false, score:best, near};
}
const nearCard = (qc, c) => c._keyChars.some(kc => kc.length >= 4 && lev(qc, kc, 1) === 1);
function judgeName(input, ans, hintUsed){
  const qc = chars(norm(input)).slice(0, MAX_ANSWER), q = qc.join('');  // 長い入力で止まらないように
  if(!q) return {g:X, msg:'回答が空でした'};
  const sc = cardScore(q, ans, 0, qc);
  let res;
  if(sc.exact) res = {g:'◎'};
  else {
    // 正解と1文字違い、または一致度が th3 未満なら、判定に効くのはほかのカードとの完全一致と1文字違いだけ
    // それ以外は、正解との一致度より margin 以上低いカードは best にしても結果が変わらないので枝刈りする
    const full = !sc.near && sc.score >= settings.th3, low = sc.score - settings.margin - 1e-9;
    let best = null, bestS = -1, bestExact = false, near = null;
    for(const c of cards){
      if(c === ans || c._norm === ans._norm) continue;
      if(!full){
        if(c._keys.includes(q)){ best = c; bestExact = true; break; }
        if(sc.near && !near && nearCard(qc, c)) near = c;
        continue;
      }
      const f = Math.max(bestS, low), s = cardScore(q, c, f, qc);
      if(s.exact){ best = c; bestExact = true; break; }
      if(s.score > f){ bestS = s.score; best = c; }
    }
    if(bestExact) res = {g:X, msg:`それは「${best.name}」です`, other:best};
    else if(sc.near) res = near ? {g:'△', msg:`「${near.name}」とも似ていて、候補が絞れません`, other:near} : {g:'○'};
    else if(sc.score < settings.th3) res = {g:X};
    else if(best && bestS - sc.score >= settings.margin) res = {g:X, msg:`もしかして「${best.name}」？`, other:best};
    else if(best && Math.abs(bestS - sc.score) < settings.margin) res = sc.score >= settings.th2 ? {g:'△', msg:`「${best.name}」とも似ていて、候補が絞れません`, other:best} : bestS >= sc.score ? {g:X, msg:`もしかして「${best.name}」？`, other:best} : {g:X};
    else if(sc.score >= settings.th2) res = {g:'△'};
    else res = {g:X};
  }
  if(hintUsed && res.g === '◎'){ res.g = '○'; res.msg = 'ヒントを使ったので○です'; }
  return res;
}

function runSearch(){
  const qn = norm(search.name), rq = norm(search.race);
  const toks = search.text.normalize('NFKC').split(/\s+/).filter(Boolean);
  const inc = toks.filter(t => !t.startsWith('-')).map(norm).filter(Boolean);
  const exc = toks.filter(t => t.startsWith('-') && t.length > 1).map(t => norm(t.slice(1))).filter(Boolean);
  const num = v => v === '' ? null : Number(v);
  const cmin = num(search.cmin), cmax = num(search.cmax), pmin = num(search.pmin), pmax = num(search.pmax);
  let res = cards.filter(c => {
    if(qn && !c._keys.some(k => k.includes(qn))) return false;
    if(rq && !c.race.some(x => norm(x).includes(rq))) return false;
    if(inc.length || exc.length){
      const hay = norm(c.text + c.flavor + c.type);
      if(!inc.every(t => hay.includes(t))) return false;
      if(exc.some(t => hay.includes(t))) return false;
    }
    if(search.civs.length){
      if(search.civMode === 'any' && !c.civ.some(x => search.civs.includes(x))) return false;
      if(search.civMode === 'all' && !search.civs.every(x => c.civ.includes(x))) return false;
      if(search.civMode === 'mono' && !(c.civ.length === 1 && search.civs.includes(c.civ[0]))) return false;
    }
    if(cmin !== null && c.cost < cmin) return false;
    if(cmax !== null && c.cost > cmax) return false;
    if((pmin !== null || pmax !== null) && c.power == null) return false;
    if(pmin !== null && c.power < pmin) return false;
    if(pmax !== null && c.power > pmax) return false;
    if(search.type && c.type !== search.type) return false;
    if(search.rarity && c.rarity !== search.rarity) return false;
    if(search.set && !c.set.includes(search.set)) return false;
    return true;
  });
  const byReading = (a, b) => (a.reading || a.name).localeCompare(b.reading || b.name, 'ja');
  const sorters = {
    cost:(a, b) => a.cost - b.cost || byReading(a, b),
    power:(a, b) => (b.power ?? -1) - (a.power ?? -1) || byReading(a, b),
    name:byReading,
    set:(a, b) => (a.set[0] || '').localeCompare(b.set[0] || '', 'ja', {numeric:true}) || a.cost - b.cost
  };
  return res.sort(sorters[search.sort] || sorters.cost);
}

const cleanCard = c => isObj(c) ? {
  name:str(c.name, 200), reading:str(c.reading, 200), type:str(c.type, 50), civ:strList(c.civ, 8, 20), cost:str(c.cost, 10), power:str(c.power, 10),
  race:strList(c.race, 8, 50), text:str(c.text, 2000), flavor:str(c.flavor, 1000), set:strList(c.set, 30, 100)
} : null;

/* --- お題（かぶっちゃやーよ・ファイブボンバー） --- */
const THEME_WORDS = ['ブロッカー','S・トリガー','W・ブレイカー','T・ブレイカー','スピードアタッカー','マッハファイター','ジャストダイバー','革命チェンジ','侵略','G・ゼロ',
  'シンパシー','進化','墓地','マナゾーン','シールド','山札','手札','タップ','破壊','パワーアタッカー'];
const ntext = c => c._ntext ?? (c._ntext = norm(c.text));
const THEME_NWORDS = THEME_WORDS.map(w => [w, norm(w)]);
const pickOf = a => a[Math.floor(Math.random() * a.length)];
const themeCache = new WeakMap(), themeValidCache = new WeakMap();
/* お題は、種類の違う条件（アトム）を2〜3個組み合わせて作る。種類は 文明・コスト・パワー・タイプ・種族・収録弾・テキストの言葉 */
const THEME_KINDS = ['civ', 'type', 'cost', 'power', 'race', 'set', 'word'];  // お題の文に並べる順
const POWER_STEPS = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 12000, 15000, 20000];
// 種族に含む語（部分一致）。「ナイト」は「ナイトメア」にも当たってしまうので入れない（「ビースト」が「ビーストフォーク」に当たるのは意図どおり）
const RACE_PARTS = ['ドラゴン', 'ドラグナー', 'エンジェル', 'コマンド', 'デーモン', 'ゾンビ', 'サムライ', 'ビースト', 'ファイター', 'ガーディアン', 'マシン', 'ハンター', 'エイリアン'];
const THEME_TRIES = 3000, THEME_BUDGET_MS = 100;  // 試行の上限（最初の50回は時間を見ない）
const THEME_EXAMPLES = 40;  // 正解発表で見せる有効な答えの最大数（hi の最大値。30人なら 30〜40 なので、ふつうは全件）
const THEME_COST_MAX = 20, THEME_VALUES_MAX = 500;  // コストの条件は0〜20だけ。タイプ・種族・収録弾は多い順に500種類まで、文明は決まった6つだけ（アトムの数を抑える）
// list（出題範囲のカード）について、アトムごとに当てはまるカードのビット集合と、カードごとに満たすアトムの一覧を1回だけ作る
// アトムの test は list の外のカードにも使える（回答の判定用）。phrase はお題の文の部品で、noun は「〜で、」「〜の」でつなぐ名詞か
function themeAtoms(list){
  if(themeCache.has(list)) return themeCache.get(list);
  const n = list.length, W = (n + 31) >>> 5, atoms = [], byKey = new Map(), cardAtoms = list.map(() => []);
  const add = (i, kind, key, mk) => {
    let a = byKey.get(key);
    if(!a){ a = {kind, key, ...mk(), bits:new Uint32Array(W), n:0, cards:[]}; atoms.push(a); byKey.set(key, a); }
    a.bits[i >>> 5] |= 1 << (i & 31); a.n++; a.cards.push(i); cardAtoms[i].push(a);
  };
  const topValues = f => {
    const m = new Map();
    for(const c of list) for(const v of new Set(f(c))) m.set(v, (m.get(v) || 0) + 1);
    return new Set([...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, THEME_VALUES_MAX).map(e => e[0]));
  };
  const okSet = topValues(c => c.set), okRace = topValues(c => c.race), okType = topValues(c => c.type ? [c.type] : []);
  const okCiv = new Set([...CIVS, 'ゼロ']);  // 文明は決まった6つだけ
  const okCost = v => Number.isInteger(v) && v >= 0 && v <= THEME_COST_MAX;
  const costs = [...new Set(list.map(c => c.cost).filter(okCost))].sort((a, b) => a - b);
  const costMax = list.reduce((m, c) => Number.isFinite(c.cost) && c.cost > m ? c.cost : m, -Infinity);  // 20を超えるコストも含めた最大（展開すると行数が多いときに引数の上限に当たる）
  const names = new Map(), nameId = new Int32Array(n);
  list.forEach((c, i) => {
    if(!names.has(c._norm)) names.set(c._norm, names.size);
    nameId[i] = names.get(c._norm);
    for(const v of new Set(c.civ)) if(okCiv.has(v)) add(i, 'civ', `civ|${v}`, () => ({phrase:`${v}文明`, noun:true, test:x => x.civ.includes(v)}));
    // しきい値 N は0〜20だけ。ただし「N以上」はコストが20を超えるカードにも当たるので、ビット集合にも入れる（test と食い違わないように）
    if(Number.isFinite(c.cost)){
      const v = c.cost;
      if(okCost(v)) add(i, 'cost', `cost=${v}`, () => ({phrase:`コスト${v}`, noun:true, test:x => x.cost === v}));
      for(const N of costs){
        // 「N以上」は最小より大きく最大より小さい N だけ（最小なら全部、最大なら「コストN」と同じ）。「N以下」は最小より大きく最大より小さい N だけ（「コスト0以下」のような不自然なお題を作らない）
        if(N > costs[0] && N < costMax && v >= N) add(i, 'cost', `cost>=${N}`, () => ({phrase:`コスト${N}以上`, noun:true, test:x => x.cost >= N}));
        if(N > costs[0] && N < costs[costs.length - 1] && v <= N) add(i, 'cost', `cost<=${N}`, () => ({phrase:`コスト${N}以下`, noun:true, test:x => x.cost <= N}));
      }
    }
    if(Number.isFinite(c.power)) for(const N of POWER_STEPS){
      if(c.power >= N) add(i, 'power', `power>=${N}`, () => ({phrase:`パワー${N}以上`, noun:true, test:x => Number.isFinite(x.power) && x.power >= N}));
      if(c.power <= N) add(i, 'power', `power<=${N}`, () => ({phrase:`パワー${N}以下`, noun:true, test:x => Number.isFinite(x.power) && x.power <= N}));
    }
    if(c.type && okType.has(c.type)){ const t = c.type; add(i, 'type', `type|${t}`, () => ({phrase:t, noun:true, test:x => x.type === t})); }
    for(const st of new Set(c.set)) if(okSet.has(st)) add(i, 'set', `set|${st}`, () => ({phrase:`「${st}」に収録された`, noun:false, test:x => x.set.includes(st)}));
    for(const r of new Set(c.race)) if(okRace.has(r)) add(i, 'race', `race|${r}`, () => ({phrase:`種族に「${r}」を持つ`, noun:false, test:x => x.race.includes(r)}));
    for(const w of RACE_PARTS) if(c.race.some(r => r.includes(w))) add(i, 'race', `race~${w}`, () => ({phrase:`種族に「${w}」を含む`, noun:false, test:x => x.race.some(r => r.includes(w))}));
    const t = ntext(c);
    for(const [w, nw] of THEME_NWORDS) if(nw && t.includes(nw)) add(i, 'word', `word|${w}`, () => ({phrase:`テキストに「${w}」とある`, noun:false, test:x => ntext(x).includes(nw)}));
  });
  const idx = {n, W, atoms, byKey, cardAtoms, nameId, stamp:new Int32Array(names.size), gen:0};
  themeCache.set(list, idx);
  return idx;
}
// アトムの組み合わせに当てはまるカードの枚数と、異なる名前の数（hi を超えたら数えるのをやめる）
function themeCount(idx, as, hi){
  const {W, nameId, stamp} = idx, gen = ++idx.gen;
  let n = 0, names = 0;
  for(let w = 0; w < W; w++){
    let b = as[0].bits[w];
    for(let k = 1; k < as.length && b; k++) b &= as[k].bits[w];
    while(b){
      const t = b & -b, i = (w << 5) + 31 - Math.clz32(t); b ^= t;
      n++;
      if(stamp[nameId[i]] !== gen){ stamp[nameId[i]] = gen; if(++names > hi) return {n, names}; }
    }
  }
  return {n, names};
}
// 当てはまるカードの集合のハッシュ（FNV-1a）。集合が同じお題（文が違っても答えが同じ）を使用済みとして扱うのに使う
function themeSig(idx, as){
  let h = 0x811c9dc5;
  for(let w = 0; w < idx.W; w++){
    let b = as[0].bits[w];
    for(let k = 1; k < as.length; k++) b &= as[k].bits[w];
    h = Math.imul(h ^ (b >>> 0), 16777619) >>> 0;
  }
  return 'set#' + h.toString(16);
}
// お題の文（自然な日本語にし、最後は「カード名」）。例：火文明で、コスト5以上で、種族に「ドラゴン」を含むカード名
function themeText(as){
  const a = [...as].sort((x, y) => THEME_KINDS.indexOf(x.kind) - THEME_KINDS.indexOf(y.kind));
  return a.map((x, i) => {
    const next = a[i + 1];
    if(!next) return x.phrase + (x.noun ? 'の' : '');
    if(x.kind === 'civ' && next.kind === 'type') return x.phrase + 'の';
    return x.phrase + (x.noun ? 'で、' : '、');
  }).join('') + 'カード名';
}
const themeKey = as => as.map(a => a.key).sort().join('&');
// 重み w の付いた items から、重複なしに k 個を選ぶ
function weightedSample(items, w, k){
  items = items.slice(); const out = [];
  while(out.length < k && items.length){
    let r = Math.random() * items.reduce((s, x) => s + w(x), 0), i = 0;
    for(; i < items.length - 1; i++){ r -= w(items[i]); if(r <= 0) break; }
    out.push(items.splice(i, 1)[0]);
  }
  return out;
}
// list から、条件に合う異なるカード名が lo 以上 hi 以下のお題を作る。used（キーと、当てはまるカードの集合のハッシュ）にあるお題と、範囲の全カードに当たるお題は使わない
// kindCounts（大会の中でその種類を使った回数）が少ない種類を優先する（重み 1/(1+回数)）
// 1. 必ず入れる種類を重みつきで決め、その種類のアトムを1つ選ぶ。そのアトムに当たるカードから1枚を選び、そのカードが満たす別の種類のアトムを1〜2個足す（答えが必ず1件以上ある）
// 2. 試行回数か時間の上限まで見つからなければ、1つのアトムだけのお題を、使った回数の少ない種類から順に探す。それも無ければ null
// 返す値の kinds は使った種類、sig は当てはまるカードの集合のハッシュ（呼び出し側で used に足す）
function makeTheme(list, lo, used = new Set(), hi = Math.max(30, lo + 10), kindCounts = {}){
  if(!list.length) return null;
  const idx = themeAtoms(list), t0 = performance.now(), weight = kd => 1 / (1 + (own(kindCounts, kd) || 0));
  // used にキーだけが入っていても、そのお題と当てはまるカードの集合が同じお題を使わないように、キーから集合のハッシュを求めて足す
  const usedSig = new Set([...used].filter(k => typeof k === 'string' && k.startsWith('set#')));
  for(const k of used){ if(typeof k !== 'string' || k.startsWith('set#')) continue; const as = k.split('&').map(x => idx.byKey.get(x)); if(as.length && as.every(Boolean)) usedSig.add(themeSig(idx, as)); }
  const tryAs = as => {
    if(used.has(themeKey(as))) return null;
    const r = themeCount(idx, as, hi);
    if(r.n >= list.length || r.names < lo || r.names > hi) return null;
    const sig = themeSig(idx, as);
    if(usedSig.has(sig)) return null;
    const tests = as.map(a => a.test);
    return {key:themeKey(as), sig, kinds:as.map(a => a.kind), text:themeText(as), test:c => tests.every(f => f(c))};
  };
  // 範囲の8割を超えるカードに当たるアトム（例：コスト13以下）は絞り込みにならないので、組み合わせには使わない
  const narrow = a => a.n <= list.length * 0.8;
  const comboKinds = new Map();
  for(const a of idx.atoms) if(narrow(a)){ const g = comboKinds.get(a.kind); g ? g.push(a) : comboKinds.set(a.kind, [a]); }
  // まず「必ず入れる種類」を重みつきで順に決め、その種類ごとに試す（種類によって条件に合う確率が違っても、出る種類が偏らないように）
  const order = weightedSample([...comboKinds.keys()], weight, comboKinds.size), per = Math.ceil(THEME_TRIES / Math.max(1, order.length));
  let tries = 0;
  for(const main of order){
    for(let j = 0; j < per && (j < 5 || tries < 50 || performance.now() - t0 < THEME_BUDGET_MS); j++, tries++){  // 時間の上限を超えても、種類ごとに最低5回は試す
      const a0 = pickOf(comboKinds.get(main)), ci = pickOf(a0.cards), byKind = new Map();
      for(const a of idx.cardAtoms[ci]){ if(a.kind === main || !narrow(a)) continue; const g = byKind.get(a.kind); g ? g.push(a) : byKind.set(a.kind, [a]); }
      if(!byKind.size) continue;
      const k = byKind.size >= 2 && Math.random() < 0.5 ? 2 : 1;
      const t = tryAs([a0, ...weightedSample([...byKind.keys()], weight, k).map(kd => pickOf(byKind.get(kd)))]);
      if(t) return t;
    }
  }
  const byKind = new Map();
  for(const a of idx.atoms){ const g = byKind.get(a.kind); g ? g.push(a) : byKind.set(a.kind, [a]); }
  const queues = shuffle([...byKind.entries()]).sort((a, b) => weight(b[0]) - weight(a[0])).map(e => shuffle(e[1]));
  for(let i = 0; queues.some(q => i < q.length); i++) for(const q of queues){ const t = q[i] && tryAs([q[i]]); if(t) return t; }
  return null;
}
// お題の回答を、全カードの名前・読み・別名と照合する。完全一致なら◎（1つの名前に決まるときだけ）
// 完全一致しないときは、有効なカードのうち一致度が最も高いものを正解とみなして、通常クイズと同じ judgeName で○・△・✖︎を決める
// （似ている別カードも有効で名前が違うときは「カードを1枚に決められない」。別カードが無効なら通常クイズと同じく△のまま（1文字違いでも△になる））
// ✖︎で「もしかして」などの候補が有効なカードなら、名前を出さずに「カードを1枚に決められない」にする
// ✖︎で候補の名前も出せないときは、全カードとの1文字違いで無効なカードに決まれば「出題範囲外／お題に合わない」と伝える
// 有効なのは、出題範囲（ctx.rangeIds）にあってお題に合うカード。同じ名前のカードが複数あるときは有効なものを選ぶ
// ctx は出題範囲と名前の索引（range・rangeIds・nameIndex）。既定は主催者の host、お題練習では session.ctx を渡す
function matchTheme(text, theme, ctx = host){
  const ok = c => ctx.rangeIds.has(c.id) && theme.test(c);
  const qc = chars(norm(text)).slice(0, MAX_ANSWER), q = qc.join('');
  if(!q) return {g:X, msg:'回答なし'};
  const found = ctx.nameIndex.get(q);
  if(found){
    if(new Set(found.map(c => c._norm)).size > 1) return {g:X, msg:'カードを1枚に決められない'};  // 読み・別名が名前の違う複数のカードに当たる
    const card = found.find(ok) || found[0];
    if(!ok(card)) return {g:X, card, msg:`「${card.name}」は${ctx.rangeIds.has(card.id) ? 'お題に合わない' : '出題範囲外'}`};
    return {g:'◎', card, valid:true, msg:`「${card.name}」`};
  }
  let ans = null, best = 0;
  for(const c of themeValid(theme, ctx)){ const s = cardScore(q, c, best, qc); if(s.score > best){ best = s.score; ans = c; } }
  const r = ans ? judgeName(text, ans, false) : {g:X};
  if(r.g === X && r.msg) return r.other && themeValid(theme, ctx).some(c => c._norm === r.other._norm) ? {g:X, msg:'カードを1枚に決められない'} : {g:X, msg:r.msg};  // 有効なカード名はヒントになるので出さない（範囲外の再録が other になっても名前で比べる）
  if(r.g === X){
    // 有効なカードに当たらないときだけ、全カードと1文字違いを見て、無効なカード（出題範囲外・お題に合わない）に決まればそれを伝える
    const byName = new Map();
    for(const c of cards){ if(nearCard(qc, c)){ const a = byName.get(c._norm); a ? a.push(c) : byName.set(c._norm, [c]); if(byName.size > 1) break; } }
    if(byName.size > 1) return {g:X, msg:'カードを1枚に決められない'};
    const same = byName.size ? [...byName.values()][0] : [], card = same.find(ok) || same[0];
    if(card && !ok(card)) return {g:X, card, msg:`「${card.name}」は${ctx.rangeIds.has(card.id) ? 'お題に合わない' : '出題範囲外'}`};
    return {g:X, msg:'カードが見つからない'};
  }
  // 有効な答えが2つに絞れない（judgeName の other 1枚ではなく有効なカード全体で見る。CSV の並び順で結果が変わらないように）
  const sc = cardScore(q, ans, 0, qc), low = sc.score - settings.margin;
  if(themeValid(theme, ctx).some(c => c._norm !== ans._norm && (sc.near ? nearCard(qc, c) : cardScore(q, c, low, qc).score > low))) return {g:X, msg:'カードを1枚に決められない'};
  return {g:r.g, card:ans, valid:true, msg:`「${ans.name}」` + (r.msg ? '・' + r.msg : '')};
}
// お題に合う出題範囲のカード（お題ごとに1回だけ作る。ctx の出題範囲（既定は主催者の host）が変わったら作り直す）
function themeValid(theme, ctx = host){
  const e = themeValidCache.get(theme);
  if(e && e.range === ctx.range) return e.list;
  const list = ctx.range.filter(theme.test);
  themeValidCache.set(theme, {range:ctx.range, list});
  return list;
}

/* --- お題練習（クイズタブの遊び方「お題練習」。かぶっちゃやーよ・ファイブボンバーのお題と判定を1人で試す。通信なし） --- */
// 状態は session（kind:'theme'）に入れる。成績（stats）は更新しない。画面は quizView の tquestion・tresult・tsummary
let practiceError = '';
// お題の判定に使う出題範囲と名前の索引（matchTheme・themeValid の ctx。作り方は hostStart と同じ）
function themeCtx(range){
  const nameIndex = new Map();  // 正規化した名前・読み・別名 → カード（お題の回答の照合用）
  for(const c of cards) for(const k of c._keys){ const a = nameIndex.get(k); a ? a.push(c) : nameIndex.set(k, [c]); }
  return {range, rangeIds:new Set(range.map(c => c.id)), nameIndex};
}
function startPractice(){
  practiceError = '';
  const range = rangeCards();
  if(!range.length){ session = null; practiceError = '出題範囲にカードがありません。出題範囲を見直してください。'; quizView = 'setup'; render(); return; }
  themeAtoms(range);  // お題の索引は開始時に作っておく（最初のお題で画面が止まらないように）
  // range は同じ配列を使い続ける（themeAtoms・themeValid のキャッシュが効くように）
  session = {kind:'theme', ctx:themeCtx(range), total:quizCfg.count || Infinity, time:quizCfg.time, idx:0, usedThemes:new Set(), themeKinds:{}, themes:[], cur:null, out:false};
  nextPracticeTheme();
}
function nextPracticeTheme(){
  const s = session;
  const theme = makeTheme(s.ctx.range, 10, s.usedThemes, 30, s.themeKinds);  // 答えの数の目標は大会を1人で開くときと同じ（lo＝10、hi＝30）
  if(!theme){
    if(!s.themes.length){ session = null; practiceError = '答えが十分にあるお題を作れませんでした。出題範囲を広げてください。'; quizView = 'setup'; render(); return; }
    s.out = true; quizView = 'tsummary'; render(); return;
  }
  s.usedThemes.add(theme.key); s.usedThemes.add(theme.sig);
  theme.kinds.forEach(k => s.themeKinds[k] = (s.themeKinds[k] || 0) + 1);
  s.idx++;
  s.cur = {theme, log:[], used:new Set(), score:0, endsAt:Date.now() + s.time * 1000, closed:false};
  quizView = 'tquestion'; render();
}
// 1回の回答。判定は大会と同じ matchTheme で、このお題で答えたカードは「既出」で0点（ファイブボンバーと同じ）。点数は BASE_PTS（スピードボーナスなし）
function practiceAnswer(text){
  const s = session, t = s && s.kind === 'theme' && quizView === 'tquestion' ? s.cur : null;
  if(!t || t.closed) return;
  if(Date.now() >= t.endsAt){ closePracticeTheme(); render(); return; }  // 時間切れのあとの回答は数えない（タイマーの確認は200msごと）
  text = String(text ?? '').slice(0, MAX_ANSWER);
  if(!text.trim()) return;  // 空欄の回答は数えない
  const res = matchTheme(text, t.theme, s.ctx);
  if(res.valid && t.used.has(res.card._norm)){ res.valid = false; res.g = X; res.msg = `「${res.card.name}」は既出`; }
  const pts = res.valid ? BASE_PTS[res.g] : 0;
  if(res.valid) t.used.add(res.card._norm);

/* --- 主催者 --- */
function partyPools(){
  const range = rangeCards(), pools = {};

  return pools;
}
function createRoom(){
  partyError = ''; setNotice('');
  if(typeof Peer === 'undefined'){ partyError = '通信用の部品を読み込めませんでした。ネットワークを確認して、ページを開き直してください。'; render(); return; }
  const code = genCode();
  const peer = new Peer(PEER_PREFIX + code, {debug:0});
  host = {peer, code, players:new Map(), phase:'opening', cfg:{...partyCfg}, idx:0, total:partyCfg.count, used:new Set(), q:null, pub:null, answers:new Map(), results:null, startedAt:0, endsAt:0, evictCount:0, evictAt:0, nextAt:0, nextTimer:0, banned:new Set(), share:false, sending:0, dataCount:0, dataStarts:new Map(), dataActive:new Set(), dataDone:new Set(), dataBytes:0};
  const me = host;
  peer.on('open', () => { if(host !== me) return; host.phase = 'lobby'; render(); });
  peer.on('error', err => {
    if(host !== me) return;
    if(err.type === 'unavailable-id' && host.phase === 'opening'){ peer.destroy(); host = null; createRoom(); return; }
    if(err.type === 'peer-unavailable') return;
    partyError = peerErrText(err);
    if(host.phase === 'opening'){ peer.destroy(); host = null; }
    render();
  });
  peer.on('disconnected', () => { if(host === me && !peer.destroyed){ try{ peer.reconnect(); }catch(e){} } });
  peer.on('connection', conn => {
    conn.on('data', m => { if(host === me) hostOnData(conn, m); });
    conn.on('close', () => { if(host === me) hostOnClose(conn); });
    conn.on('error', () => { if(host === me) hostOnClose(conn); });
  });
  render();
}
function hostOnData(conn, m){
  /* 接続ごとの受信数制限：1秒に10件を超えたら捨て、50件を超えたら切断する */
  const now = Date.now();
  if(!conn._rt || now - conn._rt >= 1000){ conn._rt = now; conn._rn = 0; }
  if(++conn._rn > 50){ try{ conn.close(); }catch(e){} return; }
  if(conn._rn > 10) return;
  if(conn._kicked) return;  // 除外・リセットで閉じようとしている接続からは受け取らない
  if(!m || typeof m !== 'object') return;
  if(m.t === 'join'){
    const pid = String(m.pid || '').slice(0, 40); if(!pid) return;
    if(conn._pid && conn._pid !== pid) return;
    if(host.banned && host.banned.has(pid)){ dropConn(conn, {t:'kicked'}); return; }  // 除外した pid は、同じ部屋の間は参加させない
    const name = (typeof m.name === 'string' ? m.name : '').trim().slice(0, 16) || '名無し';
    let p = host.players.get(pid);
    if(!p){
      // 満員のとき、ロビーなら、切断してから60秒以上たった人のうち最も前から参加している人を外して枠を空ける
      // 悪用（つなぎ直しをくり返して人を追い出す）を防ぐため、外すのは部屋全体で10秒に1人まで。進行中・最終結果では外さない（得点と順位表を保つ）
      const now = Date.now();
      if(host.players.size >= MAX_PLAYERS && host.phase === 'lobby' && (host.evictCount || 0) < EVICT_MAX && now - (host.evictAt || 0) >= EVICT_GAP_MS){
        const old = [...host.players.values()].find(x => !x.online && x.offAt && now - x.offAt >= EVICT_OFF_MS);
        if(old){ host.players.delete(old.pid); host.answers.delete(old.pid); host.evictAt = now; host.evictCount = (host.evictCount || 0) + 1; setNotice(`満員のため、切断中の${old.name}さんを外しました。`); }
      }
      if(host.players.size >= MAX_PLAYERS){ try{ conn.send({t:'error', msg:'満員のため参加できません（最大30人）。'}); }catch(e){} return; }
      p = {pid, name, score:0}; host.players.set(pid, p);
      if(gameOf(host.cfg) === 'dobon' && (host.phase === 'question' || host.phase === 'reveal')){ p.out = true; p.outAt = 0; }  // ドボンの途中から入った人は観戦
    }
    if(p.conn && p.conn !== conn){ try{ p.conn.close(); }catch(e){} }
    p.name = name; p.conn = conn; p.online = true; p.offAt = 0; conn._pid = pid;
    hostSyncSoon();
  } else if(m.t === 'answer'){
    const p = host.players.get(conn._pid);
    if(!p || host.phase !== 'question' || m.idx !== host.idx || host.answers.has(p.pid)) return;
    const game = gameOf(host.cfg);
    if(game === 'dobon' && p.out) return;  // 失格した人の回答は捨てる
    if(game === 'five' && (!host.turn || host.turn.order[host.turn.i] !== p.pid)) return;  // 順番でない人の回答は捨てる
    const a = {text:typeof m.text === 'string' ? m.text.slice(0, MAX_ANSWER) : '', ms:Date.now() - host.startedAt};
    host.answers.set(p.pid, a);
    if(game === 'five'){ fiveAnswer(p, a); return; }
    if(allAnswered()) closeQuestion();

}
// 回答を待つ人（ドボンでは失格した人を除く）が全員答えたか。ファイブボンバーは順番で進むので使わない
function allAnswered(){
  const wait = [...host.players.values()].filter(x => x.online && !(gameOf(host.cfg) === 'dobon' && x.out));
  return wait.length > 0 && wait.every(x => host.answers.has(x.pid));
}
/* 除外とリセット：知らせてから少し待って接続を閉じる（すぐ閉じると知らせが届かないことがある）。閉じるまでの間に届くものは捨てる */
function dropConn(conn, msg){
  if(!conn) return;
  conn._kicked = true;
  try{ if(conn.open) conn.send(msg); }catch(e){}
  setTimeout(() => { try{ conn.close(); }catch(e){} }, 300);
}
// 指定した参加者を除外する。pid は参加者の自己申告なので、別の pid で入り直されると防げない
function hostKick(pid){
  const p = host && host.players.get(pid); if(!p) return;
  host.banned.add(pid);
  host.players.delete(pid); host.answers.delete(pid);
  if(host.results) host.results = host.results.filter(r => r.pid !== pid);
  if(host.turn) host.turn.log = host.turn.log.filter(r => r.pid !== pid);  // その人が答えたカードは t.used に残す（既出のまま。仕様）
  dropConn(p.conn, {t:'kicked'});
  if(host.phase === 'question'){
    if(gameOf(host.cfg) === 'five'){ if(host.turn && host.turn.order[host.turn.i] === pid){ fiveAdvance(); return; } }
    else if(allAnswered()){ closeQuestion(); return; }
  }
  hostSync();
}
// 参加者を全員外す（除外とは違い、もう一度参加できる）。進行中はできない
function hostResetPlayers(){
  if(!host || (host.phase !== 'lobby' && host.phase !== 'final')) return;
  for(const p of host.players.values()) dropConn(p.conn, {t:'kicked', reset:true});
  host.players.clear(); host.answers = new Map();
  hostSync();
}
/* カードデータの受け渡し：主催者が許可したときだけ、ロビー中に join 済みの参加者へ、チャンクに分けて送る
   最後のチャンクまで送った参加者（pid）には、その部屋の間はもう送らない。送り始める回数は、pid ごとと部屋全体の両方に上限がある（中止した分も数える） */
const DATA_COLS = ['id','name','reading','type','civ','cost','power','text','rarity','set','flavor','twin_id','aliases','race'];
const DATA_CHUNK = 16000, DATA_MAX_CHUNK = 16384, DATA_MAX_N = 1000, DATA_MAX_TOTAL = 8000000, DATA_MAX_ROWS = 20000, DATA_MAX_FIELD = 10000;
const DATA_MAX_SENDS = 3, DATA_ROOM_SENDS = 60, DATA_PID_STARTS = 3, DATA_BUF_MAX = 256 * 1024, DATA_STALL = 20000, DATA_SEND_MS = 120000;
const DATA_TIMEOUT = 30000, DATA_RECV_MS = 300000;  // 参加者側：チャンクの間隔と、受信全体の締め切り
let dataCache = null;
// cards を CSV 取り込みと同じ形の行（値はすべて文字列、複数値は「/」区切り）に戻して JSON にする。cards が替わるまで使い回す
// サロゲートペアは \uXXXX に書き換える（チャンクの境界で割れても、UTF-8 で送るときに壊れないように）
function dataJSON(){
  if(!dataCache || dataCache.src !== cards){
    const rows = cards.map(c => ({id:c.id, name:c.name, reading:c.reading, type:c.type, civ:c.civ.join('/'), cost:String(c.cost), power:c.power == null ? '' : String(c.power),
      text:c.text, rarity:c.rarity, set:c.set.join('/'), flavor:c.flavor, twin_id:c.twin_id, aliases:c.aliases.join('/'), race:c.race.join('/')}));
    dataCache = {src:cards, json:JSON.stringify(rows).replace(/[\uD800-\uDFFF]/g, ch => '\\u' + ch.charCodeAt(0).toString(16))};
  }
  return dataCache.json;
}
const dataAbort = (conn, reason) => { try{ conn.send({t:'data-abort', reason}); }catch(e){} };
const utf8Len = s => new TextEncoder().encode(s).length;
function hostSendData(conn){
  const p = host.players.get(conn._pid);
  // 許可されていない要求（渡す設定がオフ・ロビー以外・古い接続）には、接続ごとに1回だけ off を返す。join していない接続には返さない
  if(!host.share || dataSource !== 'csv' || host.phase !== 'lobby' || !p || p.conn !== conn){ if(p && !conn._offSent){ conn._offSent = true; dataAbort(conn, 'off'); } return; }
  const pid = p.pid;
  // この接続へ送信中、または同じ pid が別の接続で受け取り中なら、混雑として返す（2本で同時に受け取らないように。送信中の受信は止めない）
  const busy = () => { try{ conn.send({t:'data-busy'}); }catch(e){} };
  if(conn._dataBusy || host.dataActive.has(pid)){ busy(); return; }
  // 回数の上限：受け取り済みの pid、pid ごとの開始回数、部屋全体の開始回数。同じ接続への通知は1回だけ
  if(host.dataDone.has(pid) || (host.dataStarts.get(pid) || 0) >= DATA_PID_STARTS || host.dataCount >= DATA_ROOM_SENDS){ if(!conn._limitSent){ conn._limitSent = true; dataAbort(conn, 'limit'); } return; }
  if(host.sending >= DATA_MAX_SENDS){ busy(); return; }
  const json = dataJSON();
  if(json.length > DATA_MAX_TOTAL){ dataAbort(conn, 'too-big'); return; }  // 参加者側で必ず拒否される大きさは送らない（800万文字以下なら DATA_MAX_N 以内に収まる）
  const n = Math.ceil(json.length / DATA_CHUNK);
  const me = host, id = Math.random().toString(36).slice(2, 10), started = Date.now();
  let i = 0, done = false, moved = started, lastBuf = 0;
  me.sending++; me.dataCount++; me.dataStarts.set(pid, (me.dataStarts.get(pid) || 0) + 1); me.dataActive.add(pid); conn._dataBusy = true;
  hostDataShow();
  // reason があれば data-abort を送る。最後のチャンクまで送ったときだけ受け取り済みとして数える（相手の保存の成否は確かめない）
  const end = (reason, complete) => {
    if(done) return; done = true; me.sending--; me.dataActive.delete(pid); conn._dataBusy = false;
    if(complete) me.dataDone.add(pid);
    if(reason && conn.open) dataAbort(conn, reason);
    if(host === me) hostDataShow();
  };
  // 送信バッファ（RTCDataChannel と PeerJS 内部の分）がたまっている間は待つ。減らないまま20秒、または開始から120秒で打ち切る
  const step = () => {
    if(host !== me || !conn.open) return end('');
    if(me.phase !== 'lobby') return end('start');
    if(dataSource !== 'csv') return end('reset');
    if(!me.share) return end('off');
    const now = Date.now();
    if(now - started > DATA_SEND_MS) return end('timeout');
    const buf = conn.dataChannel && conn.dataChannel.bufferedAmount || 0, bs = conn.bufferSize || 0;
    if(buf > DATA_BUF_MAX || bs > 0){
      if(buf + bs < lastBuf) moved = now;
      lastBuf = buf + bs;
      if(now - moved > DATA_STALL) return end('timeout');
      setTimeout(step, 50); return;
    }
    const s = json.slice(i * DATA_CHUNK, (i + 1) * DATA_CHUNK);
    try{ conn.send({t:'data-chunk', id, i, n, s}); }catch(e){ return end(''); }
    me.dataBytes += utf8Len(s); hostDataShow();
    moved = now; lastBuf = 0;
    if(++i >= n) return end('', true);
    setTimeout(step, 10);
  };
  step();
}
// 主催者のロビーに出す送信の状況（チャンクごとに書き換えるので、全体は描き直さない）
function dataStatusText(){
  const h = host;
  return `受け取り済み ${h.dataDone.size}人／送信中 ${h.sending}／部屋の残り回数 ${Math.max(0, DATA_ROOM_SENDS - h.dataCount)}　送った量 ${(h.dataBytes / 1048576).toFixed(1)}MB`;
}
function hostDataShow(){ const el = $('#h-data'); if(el && host) el.textContent = dataStatusText(); }
function hostOnClose(conn){
  const p = host.players.get(conn._pid);

    p.online = false; p.offAt = Date.now();

    if(host.phase === 'question' && gameOf(host.cfg) === 'five' && host.turn && host.turn.order[host.turn.i] === p.pid){ fiveAdvance('切断のため飛ばしました'); return; }

// ドボンは、生き残った人を上に（その中は点数順）、失格した人は遅く落ちた順・点数順に並べる
const dobonCmp = (a, b) => (a.out - b.out) || (a.out ? b.outAt - a.outAt : 0) || byScore(a, b);
function hostRanking(){
  const rows = [...host.players.values()].map(p => ({pid:p.pid, name:p.name, score:p.score, online:!!p.online, out:!!p.out, outAt:p.outAt || 0}));
  return gameOf(host.cfg) === 'dobon' ? rankRows(rows, dobonCmp) : rankRows(rows);

// 優勝者：ドボンは生き残った全員（いなければ1位）。ほかの形式は1位
function hostWinners(rk){
  if(gameOf(host.cfg) === 'dobon'){ const alive = rk.filter(r => !r.out); if(alive.length) return alive; }
  return rk.filter(r => r.rank === 1);

// ドボンの終わり：2人以上で始めたら生き残りが1人以下、1人で始めたらその人が失格
function dobonOver(){
  if(gameOf(host.cfg) !== 'dobon') return false;

const hostIsLast = () => host.idx >= host.total || dobonOver() || !!host.themeOut;

      sub:theme ? '' : num ? `${c.name}の${host.q.field === 'cost' ? 'コスト' : 'パワー'}` : c.reading,

      mine:host.results.find(r => r.pid === p.pid) || null,
      // 全員分の結果（回答は締め切ったあとなので見せてよい）。ほかの参加者の pid は送らず、自分の行だけ me を付ける
      results:host.results.slice(0, MAX_PLAYERS).map(r => cleanResult({name:r.name, g:r.g, pts:r.pts, input:r.input, msg:r.msg, me:r.pid === p.pid})),
      card:theme ? null : cleanCard(c)
    };
    if(s.reveal.mine) s.reveal.mine = {g:s.reveal.mine.g, pts:s.reveal.mine.pts, input:s.reveal.mine.input, msg:s.reveal.mine.msg || ''};
  }
  return s;
}
/* 参加者からの join・answer・切断による同期は 100ms ごとにまとめる。主催者の操作は hostSync で即時に送る */
let syncTimer = 0;
function hostSyncSoon(){ if(!syncTimer) syncTimer = setTimeout(() => { syncTimer = 0; hostSync(); }, 100); }
function hostSync(){
  clearTimeout(syncTimer); syncTimer = 0;
  if(!host) return;
  const rk = hostRanking();
  for(const p of host.players.values()){
    if(p.online && p.conn && p.conn.open){ try{ p.conn.send(stateFor(p, rk)); }catch(e){} }
  }
  if(tab === 'party') render();
}
function hostStart(){
  if(![...host.players.values()].some(p => p.online)){ partyError = '参加者がいないため開始できません。'; render(); return; }
  const game = gameOf(host.cfg);
  if(THEME_GAMES.includes(game)){
    const range = rangeCards();
    if(!range.length){ partyError = '出題範囲にカードがありません。クイズタブで範囲を見直してください。'; render(); return; }
    host.range = range; host.rangeIds = new Set(range.map(c => c.id)); host.usedThemes = new Set(); host.themeKinds = {};
    themeAtoms(range);  // お題の索引は開始時に作っておく（最初の問題で画面が止まらないように）
    host.nameIndex = new Map();  // 正規化した名前・読み・別名 → カード（お題の回答の照合用）
    for(const c of cards) for(const k of c._keys){ const a = host.nameIndex.get(k); a ? a.push(c) : host.nameIndex.set(k, [c]); }
  } else {
    const pools = partyPools();
    if(!Object.keys(pools).length){ partyError = '出題できる問題がありません。クイズタブで形式や範囲を見直してください。'; render(); return; }
    host.pools = pools;
  }
  partyError = ''; setNotice('');
  hostStopNext();
  host.used = new Set(); host.idx = 0; host.total = host.cfg.count; host.themeOut = false;
  for(const p of host.players.values()){ p.score = 0; p.out = false; p.outAt = 0; }
  host.startCount = [...host.players.values()].filter(p => p.online).length;
  hostNextQ();
}
function hostNextQ(){
  const game = gameOf(host.cfg);
  host.idx++;
  host.answers = new Map(); host.results = null; host.turn = null;
  if(THEME_GAMES.includes(game)){
    const online = [...host.players.values()].filter(p => p.online);
    const lo = Math.max(10, online.length), theme = makeTheme(host.range, lo, host.usedThemes, Math.max(30, lo + 10), host.themeKinds);  // 答えの数の目標（ファイブボンバーは全員が1回ずつ答えるので、人数分は必要）
    if(!theme){
      if(host.idx === 1){ host.idx = 0; host.phase = 'lobby'; host.share = false; partyError = '人数に対して答えが十分にあるお題を作れませんでした。出題範囲を広げてください。'; hostSync(); return; }
      host.idx--; host.themeOut = true; host.phase = 'final'; partyError = 'これ以上お題を作れなかったため、大会を終えました。'; hostSync(); return;
    }
    host.usedThemes.add(theme.key); host.usedThemes.add(theme.sig);
    theme.kinds.forEach(k => host.themeKinds[k] = (host.themeKinds[k] || 0) + 1);
    host.q = {fmt:'theme', theme}; host.pub = null;
    if(game === 'five'){
      host.turn = {order:shuffle(online.map(p => p.pid)), i:-1, log:[], used:new Set()};
      host.phase = 'question'; fiveAdvance(); return;
    }
  } else {
    const q = makeQ(host.pools, host.used, host.cfg.mode, false);
    host.q = q; host.pub = publicQ(q, quizCfg.customFields);
  }
  host.startedAt = Date.now(); host.endsAt = host.startedAt + host.cfg.time * 1000;
  host.phase = 'question'; hostSync();
}
/* ファイブボンバー：順番の人が答えるか、時間切れ・切断で次の人へ（reason があれば今の人の行として残す）。全員の番が終わったら締め切る
   順番が来た時点で切断している人・除外された人は飛ばす */
function fiveAdvance(reason){
  const t = host.turn; if(!t || host.phase !== 'question') return;
  if(reason && t.i >= 0 && t.i < t.order.length){
    const p = host.players.get(t.order[t.i]);
    if(p){ host.answers.set(p.pid, {text:'', ms:0}); t.log.push({pid:p.pid, name:p.name, input:'', g:X, pts:0, msg:reason}); }
  }
  do t.i++; while(t.i < t.order.length && !(host.players.get(t.order[t.i]) || {}).online);
  if(t.i >= t.order.length){ closeQuestion(); return; }
  host.startedAt = Date.now(); host.endsAt = host.startedAt + host.cfg.time * 1000;
  hostSync();
}
function fiveAnswer(p, a){
  const t = host.turn, res = matchTheme(a.text, host.q.theme);
  if(res.valid && t.used.has(res.card._norm)){ res.valid = false; res.g = X; res.msg = `「${res.card.name}」は既出`; }
  const pts = res.valid ? partyPoints(host.cfg, res, a.ms, host.cfg.time * 1000) : 0;
  if(res.valid) t.used.add(res.card._norm);
  p.score += pts;
  t.log.push({pid:p.pid, name:p.name, input:a.text, g:res.g, pts, msg:res.msg});
  fiveAdvance();
}
// 制限時間が来たとき：ファイブボンバーは順番の人だけ時間切れにして次へ、ほかは締め切る
function hostTimeUp(){ if(gameOf(host.cfg) === 'five') fiveAdvance('時間切れ'); else closeQuestion(); }
function closeQuestion(){
  if(!host || host.phase !== 'question') return;
  const q = host.q, dur = host.cfg.time * 1000, game = gameOf(host.cfg);
  if(game === 'five') host.results = host.turn ? host.turn.log.slice() : [];  // 点数は回答ごとに加えてある
  else if(game === 'kabu') host.results = kabuResults(dur);
  else {
    // ドボンは、生き残っていた人全員（切断中も）が対象。✖︎・時間切れで失格にする
    const dobon = game === 'dobon';
    host.results = [...host.players.values()].filter(p => dobon ? !p.out : (p.online || host.answers.has(p.pid))).map(p => {
      const a = host.answers.get(p.pid);
      if(!a){ if(dobon){ p.out = true; p.outAt = host.idx; } return {pid:p.pid, name:p.name, input:'', g:X, pts:0, ms:Infinity, msg:dobon ? '時間切れ・失格' : '時間切れ'}; }
      const res = judgeQ(q, a.text, host.cfg.mode, false);
      const pts = partyPoints(host.cfg, res, a.ms, dur);
      p.score += pts;
      if(dobon && res.g === X){ p.out = true; p.outAt = host.idx; }
      return {pid:p.pid, name:p.name, input:a.text, g:res.g, pts, ms:a.ms, msg:[res.msg, dobon && res.g === X ? '失格' : ''].filter(Boolean).join('・')};
    }).sort((a, b) => b.pts - a.pts || a.ms - b.ms);
  }
  // お題の形式は、有効な答え（異なる名前を最大 THEME_EXAMPLES＝40件。お題の答えは hi 以下なので、ふつうは全件）を出す
  if(THEME_GAMES.includes(game)) host.examples = [...new Set(themeValid(q.theme).map(c => c.name))].sort((a, b) => a.localeCompare(b, 'ja')).slice(0, THEME_EXAMPLES);
  host.phase = 'reveal'; hostArmNext(NEXT_MS); hostSync();
}
// かぶっちゃやーよ：有効な回答のうち、ほかの人と同じカード（名前で比べる）を答えた人は全員0点
function kabuResults(dur){
  const rows = [...host.players.values()].filter(p => p.online || host.answers.has(p.pid)).map(p => {
    const a = host.answers.get(p.pid);
    if(!a) return {p, r:{pid:p.pid, name:p.name, input:'', g:X, pts:0, ms:Infinity, msg:'時間切れ'}};
    const res = matchTheme(a.text, host.q.theme);
    return {p, res, r:{pid:p.pid, name:p.name, input:a.text, g:res.g, pts:0, ms:a.ms, msg:res.msg}};
  });
  const count = new Map();
  rows.forEach(x => { if(x.res && x.res.valid) count.set(x.res.card._norm, (count.get(x.res.card._norm) || 0) + 1); });
  rows.forEach(x => {
    if(!x.res || !x.res.valid) return;
    const n = count.get(x.res.card._norm);
    if(n > 1){ x.r.g = X; x.r.msg += `・被り（${n}人）`; return; }
    x.r.pts = partyPoints(host.cfg, x.res, x.r.ms, dur); x.p.score += x.r.pts;
  });
  return rows.map(x => x.r).sort((a, b) => b.pts - a.pts || a.ms - b.ms);
}
// 1人の1問分の得点（大会の形式を増やすときは、host.cfg の値を見てここで分ける）
function partyPoints(cfg, res, ms, dur){
  let pts = BASE_PTS[res.g];
  if(cfg.bonus && (res.g === '◎' || res.g === '○')) pts += Math.round(50 * Math.max(0, 1 - ms / dur));
  return pts;
}
// 正解発表のカウントダウン。主催者のタブが裏にあっても setTimeout で進む（遅れることはある）
function hostArmNext(ms){
  clearTimeout(host.nextTimer);
  const me = host, idx = host.idx;
  host.nextAt = Date.now() + ms;
  host.nextTimer = setTimeout(() => { if(host === me && me.phase === 'reveal' && me.idx === idx) hostNext(); }, ms);
}
function hostStopNext(){ if(host){ clearTimeout(host.nextTimer); host.nextTimer = 0; host.nextAt = 0; } }
// 「次の問題」：すぐには進めず、残りが5秒より多ければ5秒にする
function hostHurry(){
  if(!host || host.phase !== 'reveal' || !host.nextAt) return;
  if(host.nextAt - Date.now() > NEXT_SHORT_MS){ hostArmNext(NEXT_SHORT_MS); hostSync(); }
}
function hostNext(){ hostStopNext(); if(hostIsLast()){ host.phase = 'final'; hostSync(); } else hostNextQ(); }
function closeRoom(){
  if(!host) return;
  for(const p of host.players.values()){ if(p.conn && p.conn.open){ try{ p.conn.send({t:'closed'}); }catch(e){} } }
  hostStopNext();
  const peer = host.peer; host = null;
  setTimeout(() => { try{ peer.destroy(); }catch(e){} }, 300);
  render();
}

/* --- 参加者 --- */
function joinRoom(code, name){
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  name = String(name || '').trim().slice(0, 16);
  if(code.length !== 5 || !name){ partyError = '部屋コード（5文字）と表示名を入力してください。'; render(); return; }
  partyError = '';
  try{ localStorage.setItem('dmpq-name', name); }catch(e){}
  if(player && player.peer){ try{ player.peer.destroy(); }catch(e){} }
  if(player && player.dl) dlStop(player.dl);
  player = {code, name, pid:getPid(), status:'connecting', state:null, err:'', lastKey:'', deadline:0, dl:null};
  const me = player;
  render();
  if(typeof Peer === 'undefined'){ player.status = 'error'; player.err = '通信用の部品を読み込めませんでした。ネットワークを確認して、ページを開き直してください。'; render(); return; }
  const peer = new Peer({debug:0}); player.peer = peer;
  const fail = msg => { if(player !== me || STOPPED.includes(me.status)) return; me.status = 'error'; me.err = msg; render(); };
  setTimeout(() => { if(player === me && me.status === 'connecting') fail('時間内につながりませんでした。コードを確認して、もう一度試してください。'); }, 15000);
  peer.on('open', () => {
    if(player !== me) return;
    const conn = peer.connect(PEER_PREFIX + code, {reliable:true});
    me.conn = conn;
    conn.on('open', () => { if(player !== me) return; conn.send({t:'join', pid:me.pid, name:me.name}); me.status = 'joined'; render(); });
    conn.on('data', m => { if(player === me) playerOnData(m); });
    conn.on('close', () => { if(player === me && me.conn === conn && !STOPPED.includes(me.status)){ me.status = 'closed'; render(); } });
  });
  peer.on('error', err => fail(peerErrText(err)));
}
// 主催者が部屋を閉じた（ended）・除外した（kicked）・メンバーをリセットした（reset）あとは、切断やエラーで状態を上書きしない
const STOPPED = ['ended', 'kicked', 'reset'];
/* 主催者から届く状態は信用せず、使う項目だけを型と長さをそろえて取り出す */
const PHASES = ['lobby', 'question', 'reveal', 'final'];
const isObj = v => !!v && typeof v === 'object';
const rankOf = v => Number.isFinite(v) ? v : '-';
function cleanQ(q){
  if(!isObj(q)) return null;
  const civ = a => Array.isArray(a) ? a.slice(0, 8).map(v => str(v, 20)) : [];
  return {
    fmt:str(q.fmt, 10), field:q.field === 'power' || q.field === 'cost' ? q.field : null,
    choices:Array.isArray(q.choices) ? q.choices.slice(0, 10).map(v => str(v, 200)) : null,
    flavor:str(q.flavor, 1000), text:str(q.text, 2000), civ:civ(q.civ), cost:str(q.cost, 10), power:str(q.power, 10),
    facts:Array.isArray(q.facts) ? q.facts.slice(0, 10).filter(isObj).map(f => ({label:str(f.label, 20), civ:Array.isArray(f.civ) ? civ(f.civ) : null, value:str(f.value, 200)})) : [],
    name:str(q.name, 200), type:str(q.type, 50)
  };
}
// ファイブボンバーの順番と回答の一覧（人数・長さを制限する）
const cleanRelay = r => isObj(r) ? {i:fin(r.i), turn:str(r.turn, 16), mine:r.mine === true, order:strList(r.order, MAX_PLAYERS, 16),
  log:Array.isArray(r.log) ? r.log.slice(0, MAX_PLAYERS).filter(isObj).map(cleanResult) : []} : null;
function cleanState(m){
  if(!PHASES.includes(m.phase)) return null;
  const me = isObj(m.me) ? m.me : {}, r = isObj(m.reveal) ? m.reveal : null, mine = r && isObj(r.mine) ? r.mine : null;
  const time = Math.min(Math.max(0, fin(m.time)), 600);
  return {
    t:'state', phase:m.phase, game:own(GAMES, m.game) ? m.game : 'normal', idx:fin(m.idx), total:fin(m.total), mode:m.mode === 'choice' ? 'choice' : 'free', time,
    remain:Math.min(Math.max(0, fin(m.remain)), time * 1000), remainNext:Math.min(Math.max(0, fin(m.remainNext)), NEXT_MS), q:cleanQ(m.q), theme:isObj(m.theme) ? {text:str(m.theme.text, 200)} : null, relay:cleanRelay(m.relay), answered:fin(m.answered), online:fin(m.online), share:m.share === true,
    board:Array.isArray(m.board) ? m.board.slice(0, 30).filter(isObj).map(x => ({name:str(x.name, 16), score:fin(x.score), rank:rankOf(x.rank), online:x.online === true, me:x.me === true, out:x.out === true})) : [],
    me:{name:str(me.name, 16), score:fin(me.score), rank:rankOf(me.rank), answered:me.answered === true, answerText:str(me.answerText, MAX_ANSWER), out:me.out === true},
    reveal:r ? {answer:str(r.answer, 200), sub:str(r.sub, 200), examples:strList(r.examples, THEME_EXAMPLES, 200), last:r.last === true, mine:mine ? {g:str(mine.g, 4), pts:fin(mine.pts), input:str(mine.input, MAX_ANSWER), msg:str(mine.msg, 200)} : null,
      results:Array.isArray(r.results) ? r.results.slice(0, MAX_PLAYERS).filter(isObj).map(cleanResult) : [], card:cleanCard(r.card)} : null
  };
}
function playerOnData(m){
  if(!m || typeof m !== 'object') return;
  if(player.status === 'kicked' || player.status === 'reset') return;  // 除外・リセットのあとは何も受け取らない（ended は、閉じたあとの最後の state を表示に使うので STOPPED とは分ける）
  if(m.t === 'closed'){ player.status = 'ended'; render(); return; }
  if(m.t === 'kicked'){  // 主催者との接続から届いたときだけ（この関数は主催者との接続の data からだけ呼ばれる）。自動ではつなぎ直さない
    player.status = m.reset === true ? 'reset' : 'kicked';
    if(player.dl) dlStop(player.dl);
    if(player.cardOpen != null){ player.cardOpen = null; closeDetail(); }
    try{ player.peer.destroy(); }catch(e){}
    render(); return;
  }
  if(m.t === 'error'){ player.status = 'error'; player.err = str(m.msg, 200) || 'エラーが起きました'; render(); return; }
  if(m.t === 'data-chunk' || m.t === 'data-busy' || m.t === 'data-abort'){ playerOnDataMsg(m); return; }
  if(m.t !== 'state') return;
  m = cleanState(m); if(!m) return;
  player.state = m;
  if(m.phase === 'question') player.deadline = Date.now() + Number(m.remain || 0);
  player.nextDeadline = m.phase === 'reveal' ? Date.now() + m.remainNext : null;
  if(player.cardOpen != null && (m.phase !== 'reveal' || m.idx !== player.cardOpen)){ player.cardOpen = null; closeDetail(); }  // 次の問題に移ったら正解カードの表示を閉じる
  const key = playerKey(m);
  if(tab !== 'party') return;
  if(key === player.lastKey && $('#p-live')){ $('#p-live').innerHTML = playerLiveHTML(); return; }
  // 描き直しても、入力中の回答は残す
  const inp = $('#p-answer'), keep = inp ? inp.value : '';
  render();
  if(keep && $('#p-answer')) $('#p-answer').value = keep;
}
function leaveRoom(){ if(player && player.peer){ try{ player.peer.destroy(); }catch(e){} } if(player && player.dl) dlStop(player.dl); player = null; render(); }

/* --- 参加者：カードデータの受け取り（主催者から届くチャンクは cleanState を通らないので、ここで型・範囲・大きさを確かめる） --- */
async function playerReqData(){
  const P = player;
  const can = () => player === P && P.conn && P.conn.open && P.state && P.state.phase === 'lobby' && P.state.share && dlCanAsk(P.dl);
  if(!can()) return;
  const saved = await store.get('cards');
  if(saved && saved.length && !confirm(`この端末にはすでに${saved.length}枚のカードデータが保存されています。受け取ったデータで上書きしますか？上書きすると元に戻せません。`)) return;
  if(!can()) return;
  const d = P.dl = {status:'wait', id:'', n:0, parts:[], got:0, size:0, timer:0, limit:0, msg:'', ok:0, errs:[]};
  dlArm(P);
  // 受信全体の締め切り（チャンクが少しずつ届き続けても、5分で打ち切る）
  d.limit = setTimeout(() => { if(player === P && P.dl === d && (d.status === 'wait' || d.status === 'recv')) dlFail(P, '5分以内に受け取り終わらなかったため、受け取りを中断しました。', true); }, DATA_RECV_MS);
  try{ P.conn.send({t:'data-req'}); }catch(e){}
  dlShow();
}
// 頼めるのは、まだ頼んでいない・混雑と言われた・やり直せる中断のあと
const dlCanAsk = d => !d || d.status === 'busy' || (d.status === 'error' && d.retry);
// 最後にチャンクを受け付けてから（または頼んでから）30秒たったら中断する
function dlArm(P){
  clearTimeout(P.dl.timer);
  const d = P.dl;
  d.timer = setTimeout(() => { if(player === P && P.dl === d && (d.status === 'wait' || d.status === 'recv')) dlFail(P, '30秒間データが届かなかったため、受け取りを中断しました。', true); }, DATA_TIMEOUT);
}
const dlStop = d => { clearTimeout(d.timer); clearTimeout(d.limit); };
function dlFail(P, msg, retry = false){ const d = P.dl; dlStop(d); d.status = 'error'; d.msg = msg; d.retry = retry; d.parts = []; if(player === P) dlShow(); }
// 主催者からの中止の理由。知らない理由は既定の文言にする。主催者が数えない中止（limit・too-big 以外）は、もう一度頼める
const ABORT_TEXT = {
  start:'大会が始まったため、主催者が送信を中止しました。', off:'主催者が「参加者にカードデータを渡す」をオフにしたため、送信が中止されました。',
  reset:'主催者がカードデータを消したため、送信が中止されました。', 'too-big':'カードデータが大きすぎるため、主催者は送信できませんでした。',
  timeout:'送信に時間がかかりすぎたため、主催者が送信を中止しました。', limit:'この部屋でカードデータを受け取れる回数を超えたため、送信されませんでした。'
};
const ABORT_RETRY = ['start', 'off', 'reset', 'timeout'];
function dlShow(){ const el = $('#p-dl'); if(tab === 'party' && el) el.innerHTML = dlHTML(); }
function playerOnDataMsg(m){
  const P = player, d = P.dl;
  if(!d || (d.status !== 'wait' && d.status !== 'recv')) return;  // data-req を送っていないときは無視
  if(m.t === 'data-busy'){ if(d.status === 'wait'){ dlStop(d); d.status = 'busy'; dlShow(); } return; }
  if(m.t === 'data-abort'){ const r = typeof m.reason === 'string' ? m.reason : ''; dlFail(P, own(ABORT_TEXT, r) || '主催者が送信を中止しました。', ABORT_RETRY.includes(r)); return; }
  if(!P.state || P.state.phase !== 'lobby' || !P.state.share) return;  // 許可されていないときのチャンクは無視
  const i = m.i, n = m.n, s = m.s, id = m.id;
  if(!Number.isInteger(i) || !Number.isInteger(n) || i < 0 || i >= n || n > DATA_MAX_N) return;
  if(typeof s !== 'string' || s.length > DATA_MAX_CHUNK || typeof id !== 'string' || !id || id.length > 40) return;
  if(d.status === 'wait'){ if(i !== 0) return; d.status = 'recv'; d.id = id; d.n = n; d.parts = new Array(n); }  // 新しい受信は先頭のチャンクからだけ始める
  else if(id !== d.id || n !== d.n || d.parts[i] !== undefined) return;  // 別の id・重複は捨てる
  if(d.size + s.length > DATA_MAX_TOTAL){ dlFail(P, '受け取ったデータが大きすぎるため、中断しました。'); return; }
  d.parts[i] = s; d.size += s.length; d.got++;
  if(d.got < d.n){ dlArm(P); dlShow(); return; }
  dlStop(d);
  dlFinish(P);
}
// 受信した行は、使う列だけを文字列にそろえてから CSV と同じ importRows に通す
const cleanRow = r => isObj(r) && !Array.isArray(r) ? Object.fromEntries(DATA_COLS.map(k => [k, str(own(r, k), DATA_MAX_FIELD)])) : {};
async function dlFinish(P){
  const d = P.dl;
  d.status = 'saving'; dlShow();
  let rows;
  try{ rows = JSON.parse(d.parts.join('')); }catch(e){ dlFail(P, '受け取ったデータを読み取れませんでした。'); return; }
  d.parts = [];
  if(!Array.isArray(rows) || rows.length > DATA_MAX_ROWS){ dlFail(P, `受け取ったデータの形式が正しくないか、${DATA_MAX_ROWS}件を超えています。`); return; }
  const {out, errs} = importRows(rows.map(cleanRow));
  if(!out.length){ dlFail(P, '取り込めるカードがありませんでした。'); return; }  // 0件のときは報告を残さない
  importReport = {file:'主催者から受け取ったデータ', ok:out.length, errs, note:'次にこのページ（?room なし）を開いたときから使われます。'};
  // 保存の成否は cards の保存で判定する（source は補助の印）
  if(!await store.set('cards', out)){ dlFail(P, 'この端末のブラウザに保存できませんでした。'); return; }
  await store.set('source', 'csv');
  d.status = 'done'; d.ok = out.length; d.errs = errs;
  if(player === P) dlShow();
}
function dlHTML(){
  const d = player.dl, s = player.state;
  const btn = s && s.phase === 'lobby' && s.share && dlCanAsk(d) ? '<button class="btn" data-act="p-data" style="width:100%">カードデータを受け取る</button>' : '';
  if(!d) return btn;
  if(d.status === 'wait') return '<p class="note">主催者にカードデータを頼んでいます…</p>';
  if(d.status === 'recv') return `<p class="note">カードデータを受信しています… ${esc(d.got)} / ${esc(d.n)}</p>`;
  if(d.status === 'saving') return '<p class="note">受け取ったデータを確かめて保存しています…</p>';
  if(d.status === 'busy') return `<p class="note">主催者がほかの参加者に送っています。少し待ってから、もう一度押してください。</p>${btn}`;
  if(d.status === 'error') return `<p class="ng">${esc(d.msg)}</p>${btn ? `<p class="note">主催者が渡す設定をオンにしているロビー中なら、もう一度受け取れます。</p>${btn}` : ''}`;
  return `<p class="ok">${esc(d.ok)}枚を保存しました。大会が終わったら、このページ（?room なし）を開くと一人用クイズで遊べます。</p>
    ${d.errs.length ? `<p class="note"><span class="ng">${esc(d.errs.length)}件</span>は取り込めませんでした。</p><ul class="errlist">${d.errs.slice(0, 20).map(e => `<li>${esc(e.line)}行目 ${esc(e.name)}：${esc(e.problems.join('、'))}</li>`).join('')}</ul>` : ''}
    <p style="margin-top:8px"><a class="btn" href="${esc(location.pathname)}" target="_blank" rel="noopener">一人用クイズを開く（別のタブ）</a></p>`;
}
// これが変わらない更新は、#p-live だけを書き換える（ファイブボンバーは順番・回答の一覧が変わるので毎回描き直す）
const playerKey = s => `${player.status}|${s.phase}|${s.idx}|${s.me && s.me.answered}|${s.share}|${s.me && s.me.out}|${s.relay ? s.relay.i + '/' + (Array.isArray(s.relay.log) ? s.relay.log.length : 0) : ''}`;
function playerLiveHTML(){
  const s = player.state;
  if(s.phase === 'lobby') return `<h3>参加者 ${esc(s.online)}人</h3><div class="plist">${s.board.map(r => `<span class="pchip ${r.online ? '' : 'off'}">${esc(r.name)}</span>`).join('')}</div>`;
  if(s.phase === 'question') return `回答 ${esc(s.answered)} / ${esc(s.online)}人`;
  return '';
}
function playerHTML(){
  const P = player;
  const leave = `<button class="btn ghost" data-act="leave">退出する</button>`;
  if(P.status === 'connecting') return waitingHTML(`部屋「${esc(P.code)}」につないでいます…`);
  if(P.status === 'error') return `<p class="ng">${esc(P.err)}</p><div class="row"><button class="btn primary" data-act="rejoin">もう一度つなぐ</button>${leave}</div>`;
  if(P.status === 'closed') return `${waitingHTML('主催者との接続が切れました。点数は主催者側に残っているので、つなぎ直せば続きから参加できます。')}<div class="row"><button class="btn primary" data-act="rejoin">つなぎ直す</button>${leave}</div>`;
  if(P.status === 'kicked') return `${waitingHTML('主催者によって退出させられました。')}<div class="row"><button class="btn" data-act="leave">戻る</button></div>`;
  if(P.status === 'reset') return `${waitingHTML('主催者が参加者をリセットしました。もう一度参加してください。')}<div class="row"><button class="btn primary" data-act="rejoin">もう一度参加する</button>${leave}</div>`;
  if(P.status === 'ended') return `${waitingHTML('主催者が部屋を閉じました。おつかれさまでした！')}${P.state && P.state.board ? boardHTML(P.state.board) : ''}${leave}`;
  const s = P.state;
  if(!s) return waitingHTML('主催者からの応答を待っています…');
  const top = `<div class="qbar"><span><b>${esc(s.me.name)}</b>　${esc(s.me.score)}点・${esc(s.me.rank)}位</span>${leave}</div>`;
  if(s.phase === 'lobby') return `${top}${ruleHTML(s.game)}${waitingHTML('参加しました。主催者が始めるのを待っています。')}<div id="p-dl" style="margin-bottom:16px">${dlHTML()}</div><div id="p-live">${playerLiveHTML()}</div>`;
  if(s.phase === 'question'){
    const q = s.q || {}, relay = s.relay;
    const isNum = q.fmt === 'num';
    const box = `<div class="answerbox"><label for="p-answer" class="visually-hidden">回答</label><input id="p-answer" type="${isNum ? 'text' : 'search'}" ${isNum ? 'inputmode="numeric"' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${isNum ? '数字で入力' : 'カード名を入力'}"><button class="btn primary" data-act="p-submit">回答</button></div>`;
    const head = `<div class="qbar"><span><b>第${esc(s.idx)}問 / ${esc(s.total)}</b>　${esc(s.theme ? gameInfo(s.game).label : own(FMT_LABEL, q.fmt) || '')}</span>${relay ? '' : `<span id="p-live">${playerLiveHTML()}</span>`}</div>`;
    const clue = `<div class="clue">${s.theme ? themeClueHTML(s.theme) : clueHTML(q)}</div>`;
    if(s.game === 'dobon' && s.me.out) return `${top}${head}${clue}${waitingHTML('失格（観戦中）')}`;
    if(relay){
      const mine = relay.mine && !s.me.answered;
      return `${top}${head}${clue}
        <p class="nextcount">${mine ? '<b>あなた</b>の番です' : `${esc(relay.turn)}さんの番`}</p>${timerHTML('p-timer')}
        ${mine ? box : ''}
        <h3>これまでの回答</h3>${resultsHTML(relay.log)}
        <p class="note">順番：${esc(relay.order.join(' → '))}</p>`;
    }
    const answer = s.me.answered
      ? waitingHTML(`回答しました：「${esc(s.me.answerText) || '（空欄）'}」<br>締め切りを待っています`)
      : s.mode === 'choice' && Array.isArray(q.choices)
        ? `<div class="choices">${q.choices.map((v, i) => `<button class="btn" data-act="p-choose" data-i="${i}">${esc(v)}</button>`).join('')}</div>`
        : box;
    return `${top}${head}${timerHTML('p-timer')}${clue}${answer}`;
  }
  if(s.phase === 'reveal'){
    const r = s.reveal || {}, mine = r.mine, G = mine ? own(GRADE, mine.g) || GRADE[X] : null;
    return `${top}
      ${mine ? `<div class="result"><div class="stamp ${G.cls}" aria-hidden="true">${esc(mine.g)}</div><p class="verdict ${G.cls}">${G.label}</p><p class="pts">+${esc(mine.pts)}点</p>${mine.msg ? `<p class="msg">${esc(mine.msg)}</p>` : ''}</div>` : waitingHTML('この問題には参加していません')}
      <div class="correct-big"><div class="k">${s.theme ? 'お題' : '正解'}</div><div class="v">${s.theme ? themeTextHTML(r.answer) : esc(r.answer)}</div><small>${esc(r.sub)}</small></div>
      ${Array.isArray(r.examples) && r.examples.length ? `<p class="note" style="text-align:center">有効な答え（${esc(r.examples.length)}件）：${esc(r.examples.join('、'))}</p>` : ''}
      ${mine && mine.input ? `<p class="note" style="text-align:center">あなたの回答：${esc(mine.input)}</p>` : ''}
      ${s.game === 'dobon' && s.me.out ? '<p class="ng" style="text-align:center">失格（観戦中）</p>' : ''}
      ${r.card ? '<p style="text-align:center"><button class="btn" data-act="p-card">カードを見る</button></p>' : ''}
      ${nextCountHTML('p-next', playerNextRemain(s), r.last)}
      <h3>この問題の結果</h3>${resultsHTML(Array.isArray(r.results) ? r.results : [])}
      <h3>現在の順位</h3>${boardHTML(s.board)}`;
  }
  const meRow = s.board.find(r => r.me);
  return `${top}<h2>最終結果</h2>${ruleHTML(s.game)}${meRow ? `<div class="correct-big"><div class="k">あなたの順位</div><div class="v">${esc(meRow.rank)}位</div><small>${esc(meRow.score)}点</small></div>` : ''}${boardHTML(s.board)}${waitingHTML('主催者が次の大会を始めると、ここに出題されます')}`;
}
// 次の問題までの残り（受け取った時刻からローカルの時計で減らす。まだ受け取っていない描画では送られた値のまま）
const playerNextRemain = s => player.nextDeadline != null ? player.nextDeadline - Date.now() : s.remainNext;
// 正解発表で送られてきた正解カードの公開情報を表示する（この端末のカードデータは使わない。値は cleanCard 済みで、表示は esc する）
function playerCardDetail(){
  const s = player && player.state, c = s && s.phase === 'reveal' && s.reveal && s.reveal.card;
  if(!c) return;
  player.cardOpen = s.idx;
  showSheet(`${cardBodyHTML(c)}<p class="note">主催者のカードデータの内容です。</p>`);
}
function playerSubmit(text){
  const P = player; if(!P || !P.conn || !P.conn.open || !P.state || P.state.phase !== 'question') return;
  try{ P.conn.send({t:'answer', idx:P.state.idx, text:String(text).slice(0, MAX_ANSWER)}); }catch(e){}
  P.state.me.answered = true; P.state.me.answerText = String(text).slice(0, MAX_ANSWER); render();
}

/* --- 大会タブの入口 --- */
